<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- تعديل الـ viewport عشان يثبت حجم الشاشة على الموبايل -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مفاجأة روان</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #111;
            color: #fff;
            overflow-x: hidden;
            width: 100%;
        }

        .page {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .page.active { display: flex; animation: fadeIn 1s ease-in-out; }

        /* تعديلات الموبايل للخطوط */
        h1 { font-size: 2rem !important; }
        h2 { font-size: 1.5rem !important; }

        .btn {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 1.1rem;
            color: #fff;
            background-color: #ff4757;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
        }

        /* تعديل الألبوم للموبايل */
        #page2 { background-color: #fdf5e6; color: #333; }
        .gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
            width: 100%;
        }
        .polaroid {
            background: #fff;
            padding: 10px 10px 20px 10px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
            width: 150px; /* حجم أصغر للموبايل */
            border-radius: 5px;
            opacity: 0;
            transform: translateY(-20px);
        }
        .polaroid img { width: 100%; height: 150px; object-fit: cover; }
        .polaroid .caption { margin-top: 10px; font-size: 0.9rem; }

        /* تعديل خانة الباسورد للموبايل */
        #page3 { background-color: #2f3542; }
        input[type="text"] {
            padding: 12px;
            font-size: 1rem;
            width: 90%;
            max-width: 250px;
        }

        /* رسالة التهنئة */
        #page4 { background-color: #ffecd2; color: #ff4757; }
        #typing-message { font-size: 1.2rem; padding: 0 15px; }
        #special-wish { font-size: 1.2rem; padding: 15px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <!-- (نفس محتويات الصفحة السابقة بالظبط) -->
    <!-- الصفحة الأولى -->
    <section id="page1" class="page active">
        <h2 id="intro-text"></h2>
        <button class="btn" onclick="nextPage('page2')" style="display: none;" id="btn1">يلا بينا!</button>
    </section>

    <!-- الصفحة التانية -->
    <section id="page2" class="page">
        <h2>ذكرياتنا الحلوة ❤️</h2>
        <div class="gallery" id="gallery-container">
            <!-- كرر البلوك ده -->
            <div class="polaroid"><img src="photo1.jpg"><div class="caption">أحلى أيام</div></div>
            <div class="polaroid"><img src="photo2.jpg"><div class="caption">يا جدعان!</div></div>
            <!-- ... باقي الصور -->
        </div>
        <button class="btn" onclick="nextPage('page3')">كملي..</button>
    </section>

    <!-- الصفحة التالتة والرابعة (نفس اللي فات) -->
    <!-- ... -->

    <script>
        // (نفس كود الجافاسكريبت بالظبط)
        function nextPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
            if (pageId === 'page2') {
                document.querySelectorAll('.polaroid').forEach((p, index) => {
                    p.style.animation = `dropIn 0.6s forwards ${index * 0.1}s`;
                });
            }
            if (pageId === 'page4') { fireConfetti(); startFinalMessage(); }
        }
        // ... (باقي الكود)
    </script>
</body>
</html>
