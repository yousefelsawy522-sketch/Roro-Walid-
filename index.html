<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مفاجأة روان</title>
    <!-- استدعاء مكتبة الورق الملون (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* الخلفية بناتي ناعمة زي ما اتفقنا */
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #4a4a4a; 
            overflow-x: hidden; 
            width: 100%; 
            min-height: 100vh;
        }
        
        .page { display: none; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; box-sizing: border-box; }
        .page.active { display: flex; animation: fadeIn 1s ease-in-out; }
        h1 { font-size: 2.5rem !important; color: #ff4757; text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5); margin-bottom: 10px;}
        h2 { font-size: 1.8rem !important; color: #ff758c; margin-bottom: 20px;}
        
        /* تصميم الزراير */
        .btn { 
            margin-top: 20px; 
            padding: 15px 30px; 
            font-size: 1.1rem; 
            color: #fff; 
            background: linear-gradient(45deg, #ff758c 0%, #ff7eb3 100%);
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4); 
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.05); }
        
        /* =========================================
           تصميم الألبوم الكبير (تقليب الصفحات 3D)
           ========================================= */
        .album-container {
            perspective: 1500px; /* لعمل تأثير الـ 3D */
            width: 90vw;
            max-width: 350px;
            margin-bottom: 20px;
        }
        
        .album-page {
            width: 100%;
            height: 450px;
            background: #fff;
            border-radius: 5px 15px 15px 5px; /* شكل غلاف الألبوم */
            box-shadow: -5px 10px 20px rgba(0,0,0,0.2), inset -3px 0 10px rgba(0,0,0,0.05);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: right center; /* علشان يقلب من اليمين للشمال */
            position: relative;
        }

        /* كلاس الأنيميشن اللي بيشتغل لما تدوس على الزرار */
        .turn-page {
            animation: flipPage 0.8s ease-in-out;
        }

        @keyframes flipPage {
            0% { transform: rotateY(0deg); opacity: 1; }
            49% { transform: rotateY(90deg); opacity: 0; }
            50% { transform: rotateY(-90deg); opacity: 0; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        .album-page img { 
            width: 100%; 
            height: 320px; 
            object-fit: cover; 
            border-radius: 5px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            border: 5px solid #fff; /* برواز الصورة */
        }
        .album-page .caption { 
            margin-top: 20px; 
            font-size: 1.2rem; 
            color: #ff758c; 
            font-weight: bold; 
        }

        /* مربع الباسورد */
        .password-box { 
            background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(10px); 
            padding: 40px; 
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(255, 154, 158, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        input[type="text"] { 
            padding: 12px; 
            font-size: 1rem; 
            width: 90%; 
            max-width: 250px; 
            text-align: center; 
            border-radius: 25px; 
            border: 2px solid #ff7eb3; 
            outline: none;
            color: #4a4a4a;
        }
        
        /* صفحة الاحتفال */
        #page4 { justify-content: flex-start; padding-top: 40px; }
        #typing-message { font-size: 1.3rem; padding: 0 15px; color: #333; line-height: 1.6; font-weight: 500; min-height: 180px;}
        #special-wish { 
            display: none; 
            margin-top: 20px; 
            font-size: 1.4rem; 
            color: #ff4757; 
            font-weight: bold; 
            background: rgba(255, 255, 255, 0.7); 
            padding: 15px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.3);
            border: 1px solid #fff;
        }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- الصفحة الأولى -->
    <section id="page1" class="page active">
        <h2 id="intro-text"></h2>
        <button class="btn" onclick="nextPage('page2')" style="display: none;" id="btn1">يلا بينا!</button>
    </section>

    <!-- الصفحة التانية (الألبوم الكبير) -->
    <section id="page2" class="page">
        <h2>ألبوم ذكرياتنا يا روان ❤️</h2>
        
        <div class="album-container">
            <div class="album-page" id="albumPage">
                <img id="albumPhoto" src="photo1.jpg" alt="صورة">
                <div class="caption" id="albumCaption">أحلى أيام</div>
            </div>
        </div>

        <div>
            <button class="btn" onclick="flipToNextPhoto()" id="nextPhotoBtn" style="background: #fff; color: #ff758c;">اقلبي الصفحة 📖</button>
            <br>
            <button class="btn" onclick="nextPage('page3')" id="goToPassBtn" style="display: none; margin-top: 15px;">الخطوة الجاية..</button>
        </div>
    </section>

    <!-- الصفحة التالتة (الباسورد) -->
    <section id="page3" class="page">
        <div class="password-box">
            <h2>عشان تفتحي الهدية 🎁</h2>
            <p style="margin-bottom: 20px;">اكتبي كلمة السر (R31/8)</p>
            <input type="text" id="secret-pass" placeholder="R31/8">
            <br><button class="btn" onclick="checkPassword()">افتحي الهدية</button>
            <p id="error-msg" style="color: #ff4757; display: none; font-weight: bold; margin-top: 15px;">كلمة السر غلط يا روان!</p>
        </div>
    </section>

    <!-- الصفحة الرابعة (الرسالة والأمنية) -->
    <section id="page4" class="page">
        <h1>🎉 مفاجـأة! 🎉</h1>
        <div id="typing-message"></div>
        <div id="special-wish">ويارب قبل يوم 31/8 الجاي، تكوني حققتي أكبر حاجة بتتمانيها ونفرح بيكي! 🙏✨</div>
    </section>

    <!-- ==============================================
         أكواد البرمجة (الجافاسكريبت)
         ============================================== -->
    <script>
        // دالة التنقل بين الصفحات
        function nextPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
            if (pageId === 'page4') { fireConfetti(); startFinalMessage(); }
        }

        // تأثير الكتابة في الصفحة الأولى
        const introText = "في رسالة مهمة جداً عشانك يا روان... جاهزة؟";
        let i = 0;
        function typeIntro() {
            if (i < introText.length) {
                document.getElementById('intro-text').innerHTML += introText.charAt(i++);
                setTimeout(typeIntro, 80);
            } else { document.getElementById('btn1').style.display = 'inline-block'; }
        }
        window.onload = typeIntro;

        // ==============================================
        // نظام الألبوم (حط أسماء الـ 25 صورة بتوعك هنا!)
        // ==============================================
        const myPhotos = [
            { src: "photo1.jpg", caption: "أحلى أيام" },
            { src: "photo2.jpg", caption: "يوم ما كسرنا الدنيا" },
            { src: "photo3.jpg", caption: "ذكريات متتنسيش" },
            { src: "photo4.jpg", caption: "كل سنة وانتي طيبة" },
            // تقدر تنسخ السطر اللي فوق ده وتكرره لحد 25 مرة وتغير اسم الصورة والكلام
        ];

        let currentPicIndex = 0;

        function flipToNextPhoto() {
            let album = document.getElementById('albumPage');
            
            // 1. تشغيل أنيميشن تقليب الصفحة
            album.classList.remove('turn-page');
            void album.offsetWidth; // ريستارت للأنيميشن
            album.classList.add('turn-page');

            // 2. في نص الأنيميشن (والصفحة مقلوبة ومخفية)، هنغير الصورة والكلام
            setTimeout(() => {
                currentPicIndex++;
                
                if (currentPicIndex < myPhotos.length) {
                    document.getElementById('albumPhoto').src = myPhotos[currentPicIndex].src;
                    document.getElementById('albumCaption').innerText = myPhotos[currentPicIndex].caption;
                } else {
                    // لو الصور خلصت، هنجيب الصورة الأولى تاني ونظهر زرار "الخطوة الجاية"
                    document.getElementById('albumPhoto').src = myPhotos[0].src;
                    document.getElementById('albumCaption').innerText = "دي كانت أحلى ذكرياتنا!";
                    document.getElementById('nextPhotoBtn').style.display = 'none';
                    document.getElementById('goToPassBtn').style.display = 'inline-block';
                }
            }, 400); // 400 ملي ثانية (يعني نص وقت الأنيميشن بالظبط)
        }

        // ==============================================

        // فحص الباسورد
        function checkPassword() {
            let pass = document.getElementById('secret-pass').value.trim();
            if (pass === "R31/8" || pass === "R31-8" || pass === "R318") { nextPage('page4'); }
            else { document.getElementById('error-msg').style.display = 'block'; }
        }

        // الرسالة الطويلة في النهاية
        const msg = "كل سنة وانتي طيبة يا روان يا أحلى وأجدع بنت خال في الدنيا! حبيت أعملك حاجة مختلفة السنة دي تفضلي فكراها. مهما كبرنا ومهما المشاغل خدتنا، هتفضلي دايماً الأخت اللي بفتخر بيها واللي عارف إنها دايماً في ضهري. يارب السنة دي تكون سنة سعيدة عليكي، تحققي فيها كل اللي بتحلمي بيه وأكتر، وأشوفك دايماً ناجحة ومبسوطة. كل سنة وانتي طيبة يا غالية! أخوكي يوسف.";
        let mIndex = 0;
        function startFinalMessage() {
            document.getElementById('typing-message').innerHTML = ""; // تصفير النص
            function type() {
                if (mIndex < msg.length) {
                    document.getElementById('typing-message').innerHTML += msg.charAt(mIndex++);
                    setTimeout(type, 50);
                } else { document.getElementById('special-wish').style.display = 'block'; }
            }
            type();
        }

        // الورق الملون (Confetti)
        function fireConfetti() {
            var end = Date.now() + 5000;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff9a9e', '#fecfef', '#ff7eb3'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff9a9e', '#fecfef', '#ff7eb3'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
