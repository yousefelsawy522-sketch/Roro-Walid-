<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مفاجأة روان</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* خلفية بناتي ناعمة متدرجة من البينك للموف الفاتح */
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #4a4a4a; /* لون الكلام غامق عشان يكون واضح */
            overflow-x: hidden; 
            width: 100%; 
            min-height: 100vh;
        }
        
        .page { display: none; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; box-sizing: border-box; }
        .page.active { display: flex; animation: fadeIn 1s ease-in-out; }
        h1 { font-size: 2.5rem !important; color: #ff4757; text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5); }
        h2 { font-size: 1.8rem !important; color: #ff758c; }
        
        /* تصميم الزراير بلون بناتي */
        .btn { 
            margin-top: 20px; 
            padding: 15px 30px; 
            font-size: 1.1rem; 
            color: #fff; 
            background: linear-gradient(45deg, #ff758c 0%, #ff7eb3 100%);
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4); 
            font-weight: bold;
        }
        
        /* صفحة الصور */
        .gallery { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-top: 20px; width: 100%; }
        .polaroid { 
            background: #fff; 
            padding: 10px 10px 20px 10px; 
            box-shadow: 0 8px 20px rgba(255, 154, 158, 0.3); 
            width: 150px; 
            border-radius: 8px; 
            opacity: 0; 
            transform: translateY(-20px); 
        }
        .polaroid img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
        .polaroid .caption { margin-top: 10px; font-size: 0.9rem; color: #ff758c; font-weight: bold; }
        
        /* مربع الباسورد بتأثير الزجاج الشفاف */
        .password-box { 
            background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            padding: 40px; 
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(255, 154, 158, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        input[type="text"] { 
            padding: 12px; 
            font-size: 1rem; 
            width: 90%; 
            max-width: 250px; 
            text-align: center; 
            border-radius: 25px; 
            border: 2px solid #ff7eb3; 
            outline: none;
            color: #4a4a4a;
            background: rgba(255, 255, 255, 0.9);
        }
        
        /* صفحة الاحتفال */
        #page4 { justify-content: flex-start; padding-top: 50px; }
        #typing-message { font-size: 1.3rem; padding: 0 15px; color: #333; line-height: 1.6; font-weight: 500; }
        #special-wish { 
            display: none; 
            margin-top: 30px; 
            font-size: 1.4rem; 
            color: #ff4757; 
            font-weight: bold; 
            background: rgba(255, 255, 255, 0.7); 
            padding: 15px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.3);
            border: 1px solid #fff;
        }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes dropIn { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <section id="page1" class="page active">
        <h2 id="intro-text"></h2>
        <button class="btn" onclick="nextPage('page2')" style="display: none;" id="btn1">يلا بينا!</button>
    </section>

    <section id="page2" class="page">
        <h2>ذكرياتنا الحلوة يا روان ❤️</h2>
        <div class="gallery" id="gallery-container">
            <!-- كرر البلوك ده لكل صورك -->
            <div class="polaroid"><img src="photo1.jpg"><div class="caption">أحلى أيام</div></div>
            <div class="polaroid"><img src="photo2.jpg"><div class="caption">ذكرياتنا</div></div>
        </div>
        <button class="btn" onclick="nextPage('page3')">الخطوة الجاية..</button>
    </section>

    <section id="page3" class="page">
        <div class="password-box">
            <h2>عشان تفتحي الهدية 🎁</h2>
            <input type="text" id="secret-pass" placeholder="R31/8">
            <br><button class="btn" onclick="checkPassword()">افتحي الهدية</button>
            <p id="error-msg" style="color: #ff4757; display: none; font-weight: bold; margin-top: 15px;">كلمة السر غلط يا روان!</p>
        </div>
    </section>

    <section id="page4" class="page">
        <h1>🎉 مفاجـأة! 🎉</h1>
        <div id="typing-message"></div>
        <div id="special-wish">ويارب قبل يوم 31/8 الجاي، تكوني حققتي أكبر حاجة بتتمانيها ونفرح بيكي! 🙏✨</div>
    </section>

    <script>
        function nextPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
            if (pageId === 'page2') {
                document.querySelectorAll('.polaroid').forEach((p, i) => {
                    p.style.animation = `dropIn 0.6s forwards ${i * 0.1}s`;
                });
            }
            if (pageId === 'page4') { fireConfetti(); startFinalMessage(); }
        }

        const introText = "في رسالة مهمة جداً عشانك يا روان... جاهزة؟";
        let i = 0;
        function typeIntro() {
            if (i < introText.length) {
                document.getElementById('intro-text').innerHTML += introText.charAt(i++);
                setTimeout(typeIntro, 80);
            } else { document.getElementById('btn1').style.display = 'inline-block'; }
        }
        window.onload = typeIntro;

        function checkPassword() {
            let pass = document.getElementById('secret-pass').value.trim();
            if (pass === "R31/8" || pass === "R31-8" || pass === "R318") { nextPage('page4'); }
            else { document.getElementById('error-msg').style.display = 'block'; }
        }

        const msg = "كل سنة وانتي طيبة يا روان يا أحلى وأجدع بنت خال في الدنيا! حبيت أعملك حاجة مختلفة السنة دي تفضلي فكراها. مهما كبرنا ومهما المشاغل خدتنا، هتفضلي دايماً الأخت اللي بفتخر بيها واللي عارف إنها دايماً في ضهري. يارب السنة دي تكون سنة سعيدة عليكي، تحققي فيها كل اللي بتحلمي بيه وأكتر، وأشوفك دايماً ناجحة ومبسوطة. كل سنة وانتي طيبة يا غالية! أخوكي يوسف.";
        let mIndex = 0;
        function startFinalMessage() {
            function type() {
                if (mIndex < msg.length) {
                    document.getElementById('typing-message').innerHTML += msg.charAt(mIndex++);
                    setTimeout(type, 50);
                } else { document.getElementById('special-wish').style.display = 'block'; }
            }
            type();
        }

        function fireConfetti() {
            var end = Date.now() + 5000;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff9a9e', '#fecfef', '#ff7eb3'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff9a9e', '#fecfef', '#ff7eb3'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
