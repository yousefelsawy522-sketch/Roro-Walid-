<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة روان</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital@1&family=Cairo:wght@600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg: #ffe6ea; --pink: #ff4d79; --gold: #d4af37; }
        body { margin: 0; background: var(--bg); font-family: 'Cairo', sans-serif; color: #5c2a38; }
        .hidden { display: none !important; }
        .screen { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; border-radius: 25px; padding: 30px; margin: 20px auto; width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .pink-btn { background: var(--pink); color: white; border: none; padding: 15px 30px; border-radius: 50px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* ألبوم الصور */
        .rope-row { position: relative; display: flex; justify-content: space-around; padding-top: 20px; margin-bottom: 25px; }
        .rope-line { position: absolute; top: 0; left: -10px; right: -10px; height: 4px; background: var(--gold); }
        .photo-hanging { width: 30%; position: relative; animation: swing 3s infinite alternate; }
        .clip { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 10px; height: 20px; background: var(--pink); border-radius: 5px; }
        .photo-hanging img { width: 100%; height: 120px; object-fit: cover; border: 3px solid white; border-radius: 5px; transition: 0.5s; }
        @keyframes swing { 0% { transform: rotate(3deg); } 100% { transform: rotate(-3deg); } }
    </style>
</head>
<body>

    <!-- 1. شاشة القفل الأصلية -->
    <div id="lock-screen" class="screen">
        <div class="card" style="text-align:center;">
            <div style="font-size: 5rem;">🎀</div>
            <h3>اكتبي عيد ميلاد القمر امتى.. 🗝️</h3>
            <input type="text" id="pass" style="width:90%; padding:15px; margin:15px 0; text-align:center; border:2px solid var(--pink); border-radius:15px;">
            <button class="pink-btn" onclick="check()">افتحي المفاجأة 💖</button>
        </div>
    </div>

    <!-- 2. المحتوى -->
    <div id="main" class="hidden">
        <!-- كارت التاريخ والنبضة -->
        <div class="card" style="text-align:center;">
            <h1 style="color:var(--pink);">Rawan</h1>
            <div style="font-weight:bold; font-size:1.2rem;">🎂 31 • 08 • 200X 🎀</div>
            <button class="pink-btn" style="margin-top:20px;" onclick="showPulse()">أرسل نبضة حب 💖</button>
        </div>

        <!-- ألبوم الحبال -->
        <div class="card">
            <h3 style="color:var(--pink); text-align:center;">ألبوم الذكريات 📸</h3>
            <div class="rope-row">
                <div class="rope-line"></div>
                <div class="photo-hanging"><div class="clip"></div><img id="i0" src="photo1.jpg"></div>
                <div class="photo-hanging"><div class="clip"></div><img id="i1" src="photo2.jpg"></div>
                <div class="photo-hanging"><div class="clip"></div><img id="i2" src="photo3.jpg"></div>
            </div>
        </div>

        <!-- أمنية خاصة (مساحة أكبر) -->
        <div class="card">
            <h3 style="color:var(--pink);">أمنية خاصة 🌟</h3>
            <p style="font-size:1.3rem; line-height:2;">يا نور عيني، كل سنة وأنتِ طيبة وفي رعاية ربنا. بتمنالك السنة دي تحققي أغلى وأجمل ما بتتمنيه، وتفضلي دايماً منورة حياتي ومبسوطة من قلبك. ❤️</p>
        </div>

        <!-- فيديوهات -->
        <div class="card">
            <h3 style="color:var(--pink);">فيديوهاتنا 🎥</h3>
            <video controls style="width:100%; border-radius:10px;"><source src="video1.mp4" type="video/mp4"></video>
        </div>
    </div>

    <script>
        const photos = Array.from({length: 30}, (_, i) => `photo${i+1}.jpg`);
        let idx = 0;

        function check() {
            let p = document.getElementById('pass').value;
            if(p.includes("31") || p.toLowerCase().includes("r")) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main').classList.remove('hidden');
                confetti({ particleCount: 300, spread: 150, origin: { y: 0.6 } });
                setInterval(rotate, 5000);
            }
        }

        function showPulse() {
            confetti({ particleCount: 50, spread: 60, colors: ['#ff4d79'] });
        }

        function rotate() {
            for(let i=0; i<3; i++) {
                let img = document.getElementById('i'+i);
                img.style.opacity = 0;
                setTimeout(() => { img.src = photos[(idx + i) % photos.length]; img.style.opacity = 1; }, 500);
            }
            idx = (idx + 3) % photos.length;
        }
    </script>
</body>
</html>
