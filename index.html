<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة روان</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #ff758c; --secondary: #fecfef; }
        body { margin: 0; background: linear-gradient(135deg, #ff9a9e, #a18cd1); font-family: 'Segoe UI', sans-serif; overflow-x: hidden; min-height: 100vh; }

        /* البلالين الطايرة */
        .balloon { position: absolute; bottom: -100px; width: 40px; height: 50px; background: rgba(255,255,255,0.3); border-radius: 50%; animation: float 10s infinite; }
        @keyframes float { 0% { transform: translateY(0); } 100% { transform: translateY(-120vh); } }

        .page { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .page.active { display: flex; animation: fadeIn 0.8s; }
        
        /* 3D Album */
        .card { width: 250px; height: 350px; perspective: 1000px; cursor: pointer; margin: 20px; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.8s; transform-style: preserve-3d; }
        .card:hover .card-inner { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .front { background: white; }
        .front img { width: 100%; height: 100%; object-fit: cover; }
        .back { background: var(--primary); color: white; transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; padding: 20px; }

        textarea { width: 90%; height: 100px; border-radius: 15px; padding: 15px; border: none; margin: 20px 0; }
        .btn { padding: 15px 40px; background: white; color: var(--primary); border: none; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: scale(1.1); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- البلالين -->
    <div class="balloon" style="left: 10%; animation-duration: 7s;"></div>
    <div class="balloon" style="left: 30%; animation-duration: 9s;"></div>
    <div class="balloon" style="left: 60%; animation-duration: 6s;"></div>

    <section id="p1" class="page active">
        <h1 style="color: white;">مفاجأة روان 💖</h1>
        <button class="btn" onclick="nextPage('p2')">افتحي الألبوم</button>
    </section>

    <section id="p2" class="page">
        <h2>ذكرياتنا (دوس/ي ع الصورة)</h2>
        <div style="display: flex; flex-wrap: wrap; justify-content: center;">
            <div class="card"><div class="card-inner"><div class="front"><img src="photo1.jpg"></div><div class="back">أحلى أيام مع روان</div></div></div>
            <div class="card"><div class="card-inner"><div class="front"><img src="photo2.jpg"></div><div class="back">ضحك ولعب</div></div></div>
        </div>
        <button class="btn" onclick="nextPage('p3')">التالي</button>
    </section>

    <section id="p3" class="page">
        <h2>اكتبي أمنيتك يا روان ✨</h2>
        <textarea id="rawanWish" placeholder="اكتبي حاجة بتتمناها تتحقق..."></textarea>
        <button class="btn" onclick="saveWish()">موافق</button>
    </section>

    <section id="p4" class="page">
        <h1 id="bday-title">كل سنة وانتي طيبة يا روان!</h1>
        <p id="displayWish" style="font-size: 1.5rem; color: white; font-style: italic;"></p>
        <button class="btn" onclick="location.reload()">إعادة من الأول</button>
    </section>

    <script>
        function nextPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'p4') {
                confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
            }
        }
        function saveWish() {
            let w = document.getElementById('rawanWish').value;
            if(w.length < 5) { alert("اكتبي أمنية أطول شوية!"); return; }
            document.getElementById('displayWish').innerText = "أمنيتك: " + w;
            nextPage('p4');
        }
    </script>
</body>
</html>
            <div class="polaroid"><img src="photo2.jpg"><div class="caption">ذكرياتنا</div></div>
        </div>
        <button class="btn" onclick="nextPage('page3')">الخطوة الجاية..</button>
    </section>

    <section id="page3" class="page">
        <div class="password-box">
            <h2>عشان تفتحي الهدية 🎁</h2>
            <input type="text" id="secret-pass" placeholder="R31/8">
            <br><button class="btn" onclick="checkPassword()">افتحي الهدية</button>
            <p id="error-msg" style="color: #ff4757; display: none; font-weight: bold; margin-top: 15px;">كلمة السر غلط يا روان!</p>
        </div>
    </section>

    <section id="page4" class="page">
        <h1>🎉 مفاجـأة! 🎉</h1>
        <div id="typing-message"></div>
        <div id="special-wish">ويارب قبل يوم 31/8 الجاي، تكوني حققتي أكبر حاجة بتتمانيها ونفرح بيكي! 🙏✨</div>
    </section>

    <script>
        function nextPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
            if (pageId === 'page2') {
                document.querySelectorAll('.polaroid').forEach((p, i) => {
                    p.style.animation = `dropIn 0.6s forwards ${i * 0.1}s`;
                });
            }
            if (pageId === 'page4') { fireConfetti(); startFinalMessage(); }
        }

        const introText = "في رسالة مهمة جداً عشانك يا روان... جاهزة؟";
        let i = 0;
        function typeIntro() {
            if (i < introText.length) {
                document.getElementById('intro-text').innerHTML += introText.charAt(i++);
                setTimeout(typeIntro, 80);
            } else { document.getElementById('btn1').style.display = 'inline-block'; }
        }
        window.onload = typeIntro;

        function checkPassword() {
            let pass = document.getElementById('secret-pass').value.trim();
            if (pass === "R31/8" || pass === "R31-8" || pass === "R318") { nextPage('page4'); }
            else { document.getElementById('error-msg').style.display = 'block'; }
        }

        const msg = "كل سنة وانتي طيبة يا روان يا أحلى وأجدع بنت خال في الدنيا! حبيت أعملك حاجة مختلفة السنة دي تفضلي فكراها. مهما كبرنا ومهما المشاغل خدتنا، هتفضلي دايماً الأخت اللي بفتخر بيها واللي عارف إنها دايماً في ضهري. يارب السنة دي تكون سنة سعيدة عليكي، تحققي فيها كل اللي بتحلمي بيه وأكتر، وأشوفك دايماً ناجحة ومبسوطة. كل سنة وانتي طيبة يا غالية! أخوكي يوسف.";
        let mIndex = 0;
        function startFinalMessage() {
            function type() {
                if (mIndex < msg.length) {
                    document.getElementById('typing-message').innerHTML += msg.charAt(mIndex++);
                    setTimeout(type, 50);
                } else { document.getElementById('special-wish').style.display = 'block'; }
            }
            type();
        }

        function fireConfetti() {
            var end = Date.now() + 5000;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff9a9e', '#fecfef', '#ff7eb3'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff9a9e', '#fecfef', '#ff7eb3'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
