<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مفاجأة روان</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital@1&family=Cairo:wght@600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ffe6ea 0%, #ffb3c6 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --primary-pink: #ff4d79;
            --secondary-pink: #ff7eb3;
            --text-dark: #5c2a38;
            --gold: #d4af37;
        }
        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: var(--bg-gradient); color: var(--text-dark); overflow-x: hidden; width: 100%; min-height: 100vh; }
        .hidden { display: none !important; }
        .screen { min-height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; z-index: 10; background: var(--bg-gradient); }
        .card { background: var(--card-bg); border-radius: 20px; padding: 25px 20px; width: 95%; max-width: 450px; margin-bottom: 25px; border: 2px solid white; box-shadow: 0 8px 25px rgba(255, 77, 121, 0.15); backdrop-filter: blur(10px); }
        .pink-btn { background: linear-gradient(45deg, var(--primary-pink), var(--secondary-pink)); color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; }
        
        /* ألبوم الحبال */
        .rope-row { position: relative; display: flex; justify-content: space-around; padding-top: 10px; margin-bottom: 15px; }
        .rope-line { position: absolute; top: 0; left: -10px; right: -10px; height: 3px; background: repeating-linear-gradient(45deg, var(--gold), var(--gold) 5px, #b58b22 5px, #b58b22 10px); }
        .photo-hanging { position: relative; width: 30%; animation: swing 3s ease-in-out infinite alternate; transform-origin: top center; }
        .clip { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 8px; height: 18px; background-color: var(--primary-pink); border-radius: 4px; }
        .photo-hanging img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; border: 3px solid white; transition: opacity 0.5s; }
        @keyframes swing { 0% { transform: rotate(3deg); } 100% { transform: rotate(-3deg); } }

        .typewriter-text { font-size: 1.15rem; line-height: 1.8; color: var(--text-dark); text-align: right; display: none; font-weight: 600; }
        .show-msg-btn { background: white; color: var(--primary-pink); border: 2px solid var(--primary-pink); padding: 10px 20px; border-radius: 50px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <!-- القفل -->
    <div id="lock-screen" class="screen">
        <div class="card" style="text-align: center;">
            <div style="font-size: 4rem;">🎀</div>
            <input type="text" id="pass-input" style="width:90%; padding:15px; border-radius:15px; border:2px solid var(--secondary-pink); margin-bottom:20px; text-align:center;" placeholder="اكتبي الرمز..">
            <button class="pink-btn" onclick="checkPass()">افتحي المفاجأة 💖</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div id="main-screen" class="hidden" style="padding-top: 20px;">
        
        <!-- 1. الافتتاحية -->
        <div class="card">
            <h1 style="text-align:center; color: var(--primary-pink);">Rawan</h1>
            <div style="text-align:center; font-weight:bold;">🎂 200X • 08 • 31 🎀</div>
            <div style="margin-top:20px; text-align:center; font-family:'Amiri'; font-size:1.2rem;">"عامك الجديد وعمري ما يكملوش غير بنور عينيكي"</div>
        </div>

        <!-- 2. الأمنية -->
        <div class="card">
            <h3 style="color:var(--primary-pink)">أمنية خاصة 🌟</h3>
            <p id="text-2" class="typewriter-text"></p>
            <button class="show-msg-btn" id="btn-2" onclick="typeWriter('text-2', 'يا نور عيني ويا دنيتي وما فيها، كل سنة وأنتِ طيبة وفي رعاية ربنا.', 'btn-2')">عرض الأمنية 💌</button>
        </div>

        <!-- 3. الألبوم -->
        <div class="card">
            <h3 style="color:var(--primary-pink)">ألبوم الذكريات 📸</h3>
            <div class="rope-row">
                <div class="rope-line"></div>
                <div class="photo-hanging"><div class="clip"></div><img id="album-img-0" src="photo1.jpg"></div>
                <div class="photo-hanging"><div class="clip"></div><img id="album-img-1" src="photo2.jpg"></div>
                <div class="photo-hanging"><div class="clip"></div><img id="album-img-2" src="photo3.jpg"></div>
            </div>
            <div class="rope-row">
                <div class="rope-line"></div>
                <div class="photo-hanging"><div class="clip"></div><img id="album-img-3" src="photo4.jpg"></div>
                <div class="photo-hanging"><div class="clip"></div><img id="album-img-4" src="photo5.jpg"></div>
                <div class="photo-hanging"><div class="clip"></div><img id="album-img-5" src="photo6.jpg"></div>
            </div>
        </div>

        <!-- 4. الفيديوهات -->
        <div class="card">
            <h3 style="color:var(--primary-pink)">فيديوهاتنا 🎥</h3>
            <video controls style="width:100%; border-radius:10px;"><source src="video1.mp4" type="video/mp4"></video>
        </div>
    </div>

    <script>
        const albumPhotos = ["photo1.jpg", "photo2.jpg", "photo3.jpg", "photo4.jpg", "photo5.jpg", "photo6.jpg", "photo7.jpg", "photo8.jpg"];
        let idx = 0;

        function checkPass() {
            let p = document.getElementById('pass-input').value;
            if (p.includes("31") || p.toLowerCase().includes("r")) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-screen').classList.remove('hidden');
                setInterval(rotate, 5000);
            }
        }

        function rotate() {
            for (let i = 0; i < 6; i++) {
                let img = document.getElementById('album-img-' + i);
                img.style.opacity = 0;
                setTimeout(() => { img.src = albumPhotos[(idx + i) % albumPhotos.length]; img.style.opacity = 1; }, 500);
            }
            idx = (idx + 6) % albumPhotos.length;
        }

        function typeWriter(id, text, btnId) {
            document.getElementById(btnId).style.display = 'none';
            let el = document.getElementById(id);
            el.style.display = 'block';
            let i = 0;
            function t() {
                if (i < text.length) { el.innerHTML += text.charAt(i); i++; setTimeout(t, 40); }
            }
            t();
        }
    </script>
</body>
</html>
